# Codemagic: builds the iOS app on a cloud Mac. No Mac needed. See DEPLOY.md, "Building without a Mac".
#   ios-unsigned:   no Apple account needed. Produces an unsigned .ipa to sign + install with a free Apple ID (Sideloadly)
#   ios-testflight: needs the paid Apple Developer Program. Signs and uploads to TestFlight.
#                   Credentials come from the app's environment variable group "appstore_credentials"
#                   (Codemagic → this app → Environment variables), so no Team settings are needed.
workflows:
  ios-unsigned:
    name: iOS unsigned .ipa (free Apple ID)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        APP_VERSION: 1.0.0
    scripts:
      - name: Install npm packages
        script: npm install
      - name: Create the iOS project and copy in www/
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Native code, sign-in settings, MSAL (DEPLOY.md part 4a-4f)
        script: |
          gem list -i xcodeproj > /dev/null || gem install xcodeproj --no-document
          ruby tools/ios-setup.rb
      - name: Build unsigned .ipa
        script: |
          set -euo pipefail   # stop at the first failing command, so a failed build never produces an empty .ipa
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          APP=build/App.xcarchive/Products/Applications/App.app
          test -x "$APP/App" || { echo "Build produced no app at $APP"; exit 1; }
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && rm -f PrivateSkiesFeedback-unsigned.ipa && zip -qr PrivateSkiesFeedback-unsigned.ipa Payload
          ls -lh PrivateSkiesFeedback-unsigned.ipa
    artifacts:
      - build/PrivateSkiesFeedback-unsigned.ipa


  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        # APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY (.p8 contents),
        # CERTIFICATE_PRIVATE_KEY (RSA key for the distribution certificate). See DEPLOY.md.
        - appstore_credentials
      vars:
        APP_VERSION: 1.0.0                # shown to users; BUILD_NUMBER comes from Codemagic's build counter
        BUNDLE_ID: com.transworld.jets.privateskies   # same as IOS_BUNDLE_ID in tools/ios-setup.rb
    scripts:
      - name: Install npm packages
        script: npm install
      - name: Create the iOS project and copy in www/
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Native code, sign-in settings, MSAL (DEPLOY.md part 4a-4f)
        script: |
          gem list -i xcodeproj > /dev/null || gem install xcodeproj --no-document
          ruby tools/ios-setup.rb
      - name: Code signing (creates the certificate and App Store profile if missing)
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Upload only: the build appears in TestFlight for internal testers (no Apple review needed).
        # Set to true for external testers, after filling in TestFlight → Test Information in App Store Connect.
        submit_to_testflight: false
